    <div class="post-body" itemprop="articleBody"><h1 id="题目"><a href="#题目" class="headerlink" title="题目"></a>题目</h1><p><img src="/cjx132/images/Top100/%E6%89%93%E5%AE%B6%E5%8A%AB%E8%88%8D2.png"></p>
<h1 id="综述"><a href="#综述" class="headerlink" title="综述"></a>综述</h1><ul>

</ul>
<h1 id="Code"><a href="#Code" class="headerlink" title="Code"></a>Code</h1><figure class="highlight c++"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br></pre></td><td class="code"><pre><span class="line"><span class="keyword">class</span> <span class="title class_">Solution</span> &#123;</span><br><span class="line"><span class="keyword">public</span>:</span><br><span class="line">    <span class="function"><span class="type">int</span> <span class="title">rob</span><span class="params">(vector&lt;<span class="type">int</span>&gt;&amp; nums)</span> </span>&#123;</span><br><span class="line">        <span class="type">int</span> len=nums.<span class="built_in">size</span>();</span><br><span class="line">        <span class="keyword">if</span>(len==<span class="number">0</span>)<span class="keyword">return</span> <span class="number">0</span>;</span><br><span class="line">        <span class="keyword">if</span>(len==<span class="number">1</span>)<span class="keyword">return</span> nums[<span class="number">0</span>];</span><br><span class="line">        <span class="keyword">if</span>(len==<span class="number">2</span>)<span class="keyword">return</span> <span class="built_in">max</span>(nums[<span class="number">0</span>],nums[<span class="number">1</span>]);</span><br><span class="line">        <span class="comment">//有三种可能：选择第一个，不选择最后一个；选择最后一个，不选择第一个；两个都不选（由于全为正数，此种情况明显要小）</span></span><br><span class="line">        <span class="keyword">return</span> <span class="built_in">max</span>(<span class="built_in">help</span>(<span class="number">0</span>,len<span class="number">-2</span>,nums),<span class="built_in">help</span>(<span class="number">1</span>,len<span class="number">-1</span>,nums));</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="comment">//以下为打家劫舍1的解法</span></span><br><span class="line">    <span class="function"><span class="type">int</span> <span class="title">help</span><span class="params">(<span class="type">int</span> start,<span class="type">int</span> end,vector&lt;<span class="type">int</span>&gt;&amp; nums)</span></span>&#123;</span><br><span class="line">        <span class="type">int</span> a=nums[start];</span><br><span class="line">        <span class="type">int</span> b=<span class="built_in">max</span>(nums[start<span class="number">+1</span>],nums[start]);</span><br><span class="line">        <span class="keyword">for</span>(<span class="type">int</span> i=start<span class="number">+2</span>;i&lt;=end;i++)&#123;</span><br><span class="line">            <span class="type">int</span> t=b;</span><br><span class="line">            b=<span class="built_in">max</span>(b,nums[i]+a);</span><br><span class="line">            a=t;</span><br><span class="line">        &#125;</span><br><span class="line">        <span class="keyword">return</span> b;</span><br><span class="line">    &#125;</span><br><span class="line">&#125;;</span><br></pre></td></tr></table></figure>
